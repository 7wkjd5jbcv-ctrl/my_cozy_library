<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя уютная библиотека</title>
<style>
:root{
  --bg:#eee6dc; --paper:#f8f3ec; --ink:#4a4038; --muted:#8b7d70;
  --wood:#8b6650; --wood2:#a47d61; --line:#d8cabc; --accent:#756052;
}
*{box-sizing:border-box} body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);
background:radial-gradient(circle at top,#faf6f0 0,#eee6dc 48%,#e4d9cd 100%);min-height:100vh}
header{padding:28px 24px 18px;text-align:center}
h1{font-size:34px;font-weight:400;margin:0 0 5px;letter-spacing:.5px}
.subtitle{color:var(--muted);font-size:14px;font-style:italic}
.toolbar{max-width:1100px;margin:0 auto 18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);background:#f8f2ea;color:var(--ink);border-radius:12px;padding:10px 15px;cursor:pointer}
button:hover{background:#eee3d7}.primary{background:var(--accent);color:white;border-color:var(--accent)}
.search{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fffaf5;min-width:240px;outline:none}
.bookshelf{max-width:1120px;margin:auto;padding:0 18px 35px}
.shelf{margin:20px 0 30px}
.shelf-title{display:flex;align-items:center;justify-content:space-between;margin:0 6px 7px}
.shelf-title h2{font-size:18px;font-weight:400;margin:0}.count{font-size:12px;color:var(--muted)}
.books{min-height:150px;padding:18px 14px 10px;display:flex;align-items:flex-end;gap:13px;flex-wrap:wrap;
background:linear-gradient(#f5eee5,#eee2d5);border:1px solid #dacbbb;border-bottom:15px solid var(--wood);
box-shadow:0 10px 15px #7a60431c;border-radius:10px 10px 4px 4px}
.books.dragover{outline:2px dashed var(--accent);outline-offset:3px}
.book{width:78px;height:132px;border-radius:3px 5px 5px 3px;position:relative;cursor:pointer;box-shadow:3px 4px 8px #4b3c3028;
overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#fff;user-select:none}
.book .title{font-size:12px;line-height:1.15;text-shadow:0 1px 2px #0008}
.book .author{font-size:9px;margin-top:5px;opacity:.85}
.book.empty{background:#ded3c7;color:#8c7c6d;border:1px dashed #b9a99a;box-shadow:none}
.book-cover{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.book-content{position:relative;z-index:1;background:#0004;padding:4px;border-radius:3px}
.modal{position:fixed;inset:0;background:#30251e77;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal.open{display:flex}.card{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid var(--line);
border-radius:18px;padding:24px;box-shadow:0 20px 60px #0004}
.card h2{margin:0 0 4px;font-weight:400;font-size:28px}.author{color:var(--muted)}
.grid{display:grid;grid-template-columns:130px 1fr;gap:20px;margin-top:18px}
.preview{width:130px;height:190px;background:#ddd0c2;border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
textarea,input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffaf5;color:var(--ink);outline:none}
textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.stats{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.hidden{display:none}
@media(max-width:620px){.grid{grid-template-columns:1fr}.preview{margin:auto}.book{width:65px;height:112px}}
</style>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#756052"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Моя библиотека"><link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<header>
  <h1>Моя уютная библиотека</h1>
  <div class="subtitle">«У каждой книги есть своё место — и своя история»</div>
</header>

<div class="toolbar">
  <input id="search" class="search" placeholder="Поиск по названию или автору…">
  <button class="primary" onclick="openBook()">＋ Добавить книгу</button>
</div>
<div class="stats" id="stats"></div>

<main class="bookshelf" id="shelfRoot"></main>

<div class="modal" id="modal">
  <div class="card">
    <h2 id="modalTitle">Новая книга</h2>
    <div class="author" id="modalAuthor"></div>
    <div class="grid">
      <div>
        <div class="preview" id="preview">Обложка</div>
        <div class="field"><label>Ссылка на обложку (необязательно)</label><input id="cover" placeholder="https://…"></div>
      </div>
      <div>
        <div class="field"><label>Название</label><input id="title"></div>
        <div class="field"><label>Автор</label><input id="author"></div>
        <div class="field"><label>Полка</label><select id="shelf"></select></div>
        <div class="field"><label>Статус</label>
          <select id="status"><option>Хочу прочитать</option><option>Читаю</option><option>Прочитано</option></select>
        </div>
        <div class="field"><label>Моя оценка</label><select id="rating"><option value="0">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
        <div class="field"><label>Мои заметки</label><textarea id="notes" placeholder="Мысли, впечатления, любимые моменты…"></textarea></div>
      </div>
    </div>
    <div class="actions">
      <button id="deleteBtn" onclick="removeBook()" class="hidden">Удалить</button>
      <button onclick="closeModal()">Отмена</button>
      <button class="primary" onclick="saveBook()">Сохранить книгу</button>
    </div>
  </div>
</div>

<script>
const KEY='cozy-library-v1';
const shelves=[
 {id:'s1',name:'Полка 1 · Любимые'},
 {id:'s2',name:'Полка 2 · Прочитать'},
 {id:'s3',name:'Полка 3 · Романы'},
 {id:'s4',name:'Полка 4 · Фэнтези'},
 {id:'s5',name:'Полка 5 · Детективы'},
 {id:'s6',name:'Полка 6 · Другое'}
];
let books=JSON.parse(localStorage.getItem(KEY)||'[]'), editing=null, dragId=null;

function persist(){localStorage.setItem(KEY,JSON.stringify(books));render()}
function stars(n){return n? '★'.repeat(n)+'☆'.repeat(5-n):''}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const root=document.getElementById('shelfRoot');
 root.innerHTML='';
 let visible=0;
 shelves.forEach(s=>{
  const arr=books.filter(b=>b.shelf===s.id && (!q || (b.title+' '+b.author).toLowerCase().includes(q)));
  visible+=arr.length;
  const sec=document.createElement('section');sec.className='shelf';
  sec.innerHTML=`<div class="shelf-title"><h2>${s.name}</h2><span class="count">${arr.length} книг</span></div>
  <div class="books" data-shelf="${s.id}"></div>`;
  const box=sec.querySelector('.books');
  arr.forEach(b=>{
    const el=document.createElement('div');el.className='book';el.draggable=true;el.dataset.id=b.id;
    el.style.background=b.color||'#756052';
    el.innerHTML=(b.cover?`<img class="book-cover" src="${esc(b.cover)}" onerror="this.remove()">`:'')+
      `<div class="book-content"><div class="title">${esc(b.title)}</div><div class="author">${esc(b.author||'')}</div></div>`;
    el.onclick=()=>openBook(b.id);el.ondragstart=()=>dragId=b.id;
    box.appendChild(el);
  });
  const empty=document.createElement('div');empty.className='book empty';empty.innerHTML='+<br><small>добавить</small>';
  empty.onclick=()=>openBook(null,s.id);box.appendChild(empty);
  box.ondragover=e=>{e.preventDefault();box.classList.add('dragover')};
  box.ondragleave=()=>box.classList.remove('dragover');
  box.ondrop=e=>{e.preventDefault();box.classList.remove('dragover');let b=books.find(x=>x.id===dragId);if(b){b.shelf=s.id;persist()}};
  root.appendChild(sec);
 });
 document.getElementById('stats').textContent=`${books.length} книг в библиотеке · ${visible} отображается`;
}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fillShelves(sel){sel.innerHTML=shelves.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
function openBook(id=null,shelf='s1'){
 editing=id; const b=books.find(x=>x.id===id);
 document.getElementById('modalTitle').textContent=b?'Редактировать книгу':'Новая книга';
 document.getElementById('modalAuthor').textContent=b?.author||'';
 document.getElementById('title').value=b?.title||'';
 document.getElementById('author').value=b?.author||'';
 fillShelves(document.getElementById('shelf'));document.getElementById('shelf').value=b?.shelf||shelf;
 document.getElementById('status').value=b?.status||'Хочу прочитать';
 document.getElementById('rating').value=b?.rating||'0';
 document.getElementById('notes').value=b?.notes||'';
 document.getElementById('cover').value=b?.cover||'';
 document.getElementById('deleteBtn').classList.toggle('hidden',!b);
 updatePreview();document.getElementById('modal').classList.add('open');
}
function updatePreview(){let u=document.getElementById('cover').value, p=document.getElementById('preview');p.innerHTML=u?`<img src="${esc(u)}" onerror="this.style.display='none'">`:'Обложка'}
document.getElementById('cover').addEventListener('input',updatePreview);
function saveBook(){
 const title=document.getElementById('title').value.trim(); if(!title){alert('Добавь название книги');return}
 const data={id:editing||Date.now().toString(),title,author:document.getElementById('author').value.trim(),
 shelf:document.getElementById('shelf').value,status:document.getElementById('status').value,
 rating:Number(document.getElementById('rating').value),notes:document.getElementById('notes').value,
 cover:document.getElementById('cover').value.trim(),color:['#756052','#8c6f5a','#6e665f','#7d655d','#9a765e'][Math.floor(Math.random()*5)]};
 const i=books.findIndex(b=>b.id===data.id);if(i>=0)books[i]=data;else books.push(data);
 persist();closeModal();
}
function removeBook(){if(!editing)return;if(confirm('Удалить эту книгу?')){books=books.filter(b=>b.id!==editing);persist();closeModal()}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('search').addEventListener('input',render);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
</script>
<script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script>
</body>
</html>
